stages:
  - lint
  - test
  - benchmark
  - e2e
  - build

variables:
  PNPM_VERSION: "9.15.0"
  CARGO_HOME: "${CI_PROJECT_DIR}/.cargo"
  RUSTUP_HOME: "${CI_PROJECT_DIR}/.rustup"

.default_before_script: &default_before_script
  - corepack enable
  - corepack prepare pnpm@${PNPM_VERSION} --activate
  - pnpm install --frozen-lockfile

lint:typescript:
  stage: lint
  image: node:22-bookworm
  before_script: *default_before_script
  script:
    - pnpm lint
    - pnpm typecheck

lint:rust:
  stage: lint
  image: rust:1.83-bookworm
  before_script:
    - apt-get update && apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
  script:
    - cd apps/studio-desktop/src-tauri
    - cargo clippy -- -D warnings
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

test:typescript:
  stage: test
  image: node:22-bookworm
  before_script: *default_before_script
  script:
    - pnpm test

test:rust:
  stage: test
  image: rust:1.83-bookworm
  before_script:
    - apt-get update && apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
  script:
    - cd apps/studio-desktop/src-tauri
    - cargo test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

benchmark:
  stage: benchmark
  image: node:22-bookworm
  before_script: *default_before_script
  script:
    - pnpm bench
  artifacts:
    paths:
      - .bench-cache/
    expire_in: 30 days

e2e:
  stage: e2e
  image: node:22-bookworm
  before_script: *default_before_script
  script:
    - pnpm e2e
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

build:linux:
  stage: build
  image: node:22-bookworm
  tags:
    - linux
  before_script:
    - apt-get update && apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
    - *default_before_script
    - rustup target add x86_64-unknown-linux-gnu
  script:
    - pnpm --filter @consequence/studio-desktop tauri build
  artifacts:
    paths:
      - apps/studio-desktop/src-tauri/target/release/bundle/
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

build:macos:
  stage: build
  tags:
    - macos
  before_script: *default_before_script
  script:
    - pnpm --filter @consequence/studio-desktop tauri build --target universal-apple-darwin
  artifacts:
    paths:
      - apps/studio-desktop/src-tauri/target/release/bundle/
    expire_in: 7 days
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

build:windows:
  stage: build
  tags:
    - windows
  before_script: *default_before_script
  script:
    - pnpm --filter @consequence/studio-desktop tauri build
  artifacts:
    paths:
      - apps/studio-desktop/src-tauri/target/release/bundle/
    expire_in: 7 days
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
