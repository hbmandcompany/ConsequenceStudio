stages:
  - lint
  - test
  - benchmark
  - e2e
  - mirror
  - build
  - release

variables:
  PNPM_VERSION: "9.15.0"
  CARGO_HOME: "${CI_PROJECT_DIR}/.cargo"
  RUSTUP_HOME: "${CI_PROJECT_DIR}/.rustup"
  # GitHub mirror repo for public installer URLs (override in CI/CD settings if needed).
  # GitHub Releases target (installers + downloads.json). Same repo as the website — do NOT git-push studio code here.
  GITHUB_REPO: "hbmandcompany/Consequence"
  # Optional: set in CI/CD variables to mirror studio *source code* to a separate GitHub repo (e.g. hbmandcompany/ConsequenceStudio).
  # GITHUB_CODE_MIRROR_REPO: ""

.default_before_script: &default_before_script
  - corepack enable
  - corepack prepare pnpm@${PNPM_VERSION} --activate
  - pnpm install --frozen-lockfile

.main_or_mr: &main_or_mr
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: $CI_COMMIT_BRANCH == "main"

.main_or_tag: &main_or_tag
  - if: $CI_COMMIT_BRANCH == "main"
  - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/

.tag_only: &tag_only
  - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/

lint:typescript:
  stage: lint
  image: node:22-bookworm
  before_script: *default_before_script
  script:
    - pnpm lint
    - pnpm typecheck
  rules: *main_or_mr

lint:rust:
  stage: lint
  image: rust:1.85-bookworm
  variables:
    CARGO_HOME: "/usr/local/cargo"
    RUSTUP_HOME: "/usr/local/rustup"
  before_script:
    - apt-get update && apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
    - rustup component add clippy
  script:
    - cd apps/studio-desktop/src-tauri
    - cargo clippy -- -D warnings
  rules: *main_or_mr

test:typescript:
  stage: test
  image: node:22-bookworm
  before_script: *default_before_script
  script:
    - pnpm test
  rules: *main_or_mr

test:rust:
  stage: test
  image: rust:1.85-bookworm
  variables:
    CARGO_HOME: "/usr/local/cargo"
    RUSTUP_HOME: "/usr/local/rustup"
  before_script:
    - apt-get update && apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
  script:
    - cd apps/studio-desktop/src-tauri
    - cargo test
  rules: *main_or_mr

benchmark:
  stage: benchmark
  image: node:22-bookworm
  before_script: *default_before_script
  script:
    - pnpm bench
  artifacts:
    paths:
      - .bench-cache/
    expire_in: 30 days
  rules: *main_or_mr

e2e:
  stage: e2e
  image: node:22-bookworm
  before_script: *default_before_script
  script:
    - pnpm e2e
  rules: *main_or_mr

build:linux:
  stage: build
  image: node:22-bookworm
  tags:
    - linux
  before_script:
    - apt-get update && apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
    - *default_before_script
    - rustup target add x86_64-unknown-linux-gnu
  script:
    - pnpm --filter @consequence/studio-desktop tauri build
    - node deploy/release/collect-bundle.mjs linux
  artifacts:
    paths:
      - release-artifacts/
    expire_in: 30 days
  rules: *main_or_tag

build:macos:
  stage: build
  tags:
    - macos
  before_script: *default_before_script
  script:
    - pnpm --filter @consequence/studio-desktop tauri build --target universal-apple-darwin
    - node deploy/release/collect-bundle.mjs macos
  artifacts:
    paths:
      - release-artifacts/
    expire_in: 30 days
  allow_failure: true
  rules: *main_or_tag

build:windows:
  stage: build
  tags:
    - windows
  before_script: *default_before_script
  script:
    - pnpm --filter @consequence/studio-desktop tauri build
    - node deploy/release/collect-bundle.mjs windows
  artifacts:
    paths:
      - release-artifacts/
    expire_in: 30 days
  allow_failure: true
  rules: *main_or_tag

mirror:github:
  stage: mirror
  image: alpine/git:latest
  variables:
    GIT_DEPTH: "0"
  script:
    - sh deploy/release/mirror-git.sh
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/

release:mirror:
  stage: release
  image: node:22-bookworm
  needs:
    - job: build:linux
      artifacts: true
    - job: build:macos
      artifacts: true
      optional: true
    - job: build:windows
      artifacts: true
      optional: true
  script:
    - node deploy/release/mirror-release.mjs
  artifacts:
    paths:
      - release-artifacts/downloads.json
    expire_in: 1 year
  rules: *tag_only
