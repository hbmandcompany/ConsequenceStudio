apiVersion: apps/v1
kind: Deployment
metadata:
  name: consequence-theory
  namespace: consequence-theory
  labels:
    app.kubernetes.io/name: consequence-theory
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: consequence-theory
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: consequence-theory
    spec:
      containers:
        - name: theory
          image: node:22-alpine
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              cd /app
              npm init -y >/dev/null 2>&1
              npm install ws@8 --omit=dev --silent
              node server.mjs
          ports:
            - containerPort: 8741
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: theory-config
            - secretRef:
                name: theory-secrets
          volumeMounts:
            - name: server
              mountPath: /app/server.mjs
              subPath: server.mjs
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: server
          configMap:
            name: cmte-server
      terminationGracePeriodSeconds: 30
